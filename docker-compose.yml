services:
  kortex-site:
    image: ghcr.io/shalom-302/kortex-js:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Empty = defaults in app/api/contact/route.ts (founder's Gmail, Resend test sender).
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
    expose:
      - "3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
